# Config file for DeepForest pytorch module

# Cpu workers for data loaders
# Dataloaders
workers: 0
devices: auto
accelerator: auto
batch_size: 5

# Model Architecture
# architecture: 'retinanet'
architecture: 'FasterRCNN' # Uncomment to use FasterRCNN, FIXME this fails because of a non defined Learning Rate Scheduler
# architecture: 'DeformableDetr' # Uncomment to use DeformableDetr
num_classes: 1
nms_thresh: 0.05
score_thresh: 0.1

model:
    name: 'joshvm/milliontrees-detr'
    revision: 'main'

# Pre-processing parameters
path_to_raster:
patch_size: 400
patch_overlap: 0.05
annotations_xml:
rgb_dir:
path_to_rgb:

train:
    csv_file: /home/cwinkelmann/work/deepforest/data/DeepWaterHorizon/train_annotations.csv
    root_dir: /home/cwinkelmann/work/deepforest/data/DeepWaterHorizon

    # Optimizer initial learning rate
    lr: 0.001
    scheduler:
        type:  # Options: "StepLR", "MultiStepLR", "ExponentialLR", "CosineAnnealingLR", "LambdaLR", "MultiplicativeLR", or "ReduceLROnPlateau"
        params:
            # Common parameters
            T_max: 10
            eta_min: 0.00001
            lr_lambda: "0.95 ** epoch"  # For lambdaLR and multiplicativeLR
            step_size: 30  # For stepLR
            gamma: 0.1  # For stepLR, multistepLR, and exponentialLR
            milestones: [50, 100]  # For multistepLR


            # ReduceLROnPlateau parameters (used if type is not explicitly mentioned)
            mode: "min"
            factor: 0.1
            patience: 10
            threshold: 0.0001
            threshold_mode: "rel"
            cooldown: 0
            min_lr: 0
            eps: 0.00000001

    # Print loss every n epochs
    epochs: 100
    # Useful debugging flag in pytorch lightning, set to True to get a single batch of training to test settings.
    fast_dev_run: False
    # preload images to GPU memory for fast training. This depends on GPU size and number of images.
    preload_images: False

validation:
    # callback args
    csv_file: /home/cwinkelmann/work/deepforest/data/DeepWaterHorizon/test_annotations.csv
    root_dir: /home/cwinkelmann/work/deepforest/data/DeepWaterHorizon
    preload_images: False
    size: 640

    # Intersection over union evaluation
    iou_threshold: 0.4
    val_accuracy_interval: 20

predict:
    pin_memory: False
